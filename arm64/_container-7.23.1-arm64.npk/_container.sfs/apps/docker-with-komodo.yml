name: docker-with-komodo
descr: Komodo is a web app to provide structure for managing your servers, builds, deployments, and automated procedures.
page: https://github.com/moghtech/komodo
category: productivity
default-credentials: admin:admin
services:
  db:
    image: docker.io/mikrotik/mongodb-community-server:latest
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD: bK13wmvmNnYO3w8ZQBCXrsE1oNDKzKQ3
    volumes:
      - data:/data/db
  core:
    image: ghcr.io/moghtech/komodo-core:latest
    ports:
      - 9120:9120:web
    restart: unless-stopped
    volumes:
      - backups:/backups
    environment:
      KOMODO_DATABASE_ADDRESS: db:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD: bK13wmvmNnYO3w8ZQBCXrsE1oNDKzKQ3
      KOMODO_LOCAL_AUTH: true
      KOMODO_INIT_ADMIN_USERNAME: admin
      KOMODO_INIT_ADMIN_PASSWORD: admin
      KOMODO_FIRST_SERVER: http://periphery:8120
      KOMODO_PASSKEY: 9XofOL0aFXwBdPgac07kgfGgqkaHLs0d
      restart: unless-stopped
  dind:
    image: docker.io/mikrotik/dind:latest
    restart: unless-stopped
    volumes:
      - dind-run:/var/run
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:latest
    restart: unless-stopped
    volumes:
      - dind-run:/var/run
      - komodo:/etc/komodo
    environment:
      PERIPHERY_SSL_ENABLED: false
      PERIPHERY_PASSKEYS: 9XofOL0aFXwBdPgac07kgfGgqkaHLs0d
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
networks:
  default:
    name: lan
    external: true
