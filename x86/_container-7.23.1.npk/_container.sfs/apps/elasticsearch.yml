name: elasticsearch
descr: open source, distributed search and analytics engine built for speed, scale, and AI applications
page: https://elastic.co
category: search
default-credentials: web setup
services:
  elasticsearch:
    image: docker.io/elasticsearch:9.3.1
    ports:
      - '5601:5601:web'
      - '9200:9200:rest api'
    volumes:
      - data:/usr/share/elasticsearch/data
    environment:
      ELASTIC_PASSWORD: qG1cP9hmskAtQqVEgFNJOWZ6XGp7vXBr
      discovery.type: single-node
  kibana:
    image: docker.io/kibana:9.3.1
