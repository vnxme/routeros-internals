name: mikrodash
category: monitoring
page: https://github.com/SecOps-7/MikroDash
descr: The Ultimate MikroTik RouterOS Dashboard.
services:
  mikrodash:
    image: docker.io/mikrotik/mikrodash
    restart: unless-stopped
    ports:
      - "3081:3081"
    volumes:
      - data:/data
    environment:
      ROUTER_HOST: "[routerIP]"
      ROUTER_USER: admin
      ROUTER_PASS:
      ROUTER_TLS: false
      ROUTER_PORT: 8728
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mikrodash-data:
